
services:
  # ----------------------------------------------------
  # 1. Main Agent & Data Runtime (The brain of the operation)
  # ----------------------------------------------------
  vre-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vre_runtime
    restart: unless-stopped
    ports:
      - "7860:7860"
    command: uvicorn src.web.app:app --host 0.0.0.0 --port 7860
    depends_on:
      - vre-vectordb
    environment:
      # Internal Docker DNS allows services to talk via container names
      - QDRANT_URL=http://vre-vectordb:6333
      - QDRANT_EMBEDDED=0
      - VLLM_URL=http://vre-inference:8000/v1
    volumes:
      - fastf1_cache:/home/race_engineer/.cache/fastf1
      - duckdb_data:/data/duckdb
      # Fix shadowing: Mount specific folders instead of root to protect the Linux .venv
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - vre_network

  # 2. FIA Regulatory Vector Database (Qdrant)
 
  vre-vectordb:
    image: qdrant/qdrant:latest
    container_name: vre_vectordb
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API port mapped to localhost
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - vre_network

  # 3. High-Speed LLM Inference Engine (vLLM)

  vre-inference:
    image: vllm/vllm-openai:latest
    container_name: vre_inference
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # We will pass this in later via a .env file
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      # Prevents re-downloading the massive model weights every time
      - huggingface_cache:/root/.cache/huggingface
    # Spin up the 8B model. Adjust max-model-len based on your specific GPU VRAM.
    command: --model meta-llama/Meta-Llama-3.1-8B-Instruct --dtype auto --max-model-len 4096 --gpu-memory-utilization 0.90
    networks:
      - vre_network
    # --- WSL2 NVIDIA GPU PASSTHROUGH ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# Define an isolated bridge network for secure service communication
networks:
  vre_network:
    driver: bridge

# Define persistent volumes so data isn't wiped when containers shut down
volumes:
  fastf1_cache:
  duckdb_data:
  qdrant_data:
  huggingface_cache:
